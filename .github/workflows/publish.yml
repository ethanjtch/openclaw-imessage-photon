name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishers — no long-lived token in secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build main package
        run: |
          npm ci || npm install
          npm run build

      # npm ≥9.8.1 obtains an OIDC token automatically during publish and
      # exchanges it against the Trusted Publisher configured on the npm
      # package. No NODE_AUTH_TOKEN / .npmrc needed here.
      - name: Publish main package (openclaw-imessage-photon)
        run: npm publish --provenance

      - name: Publish CLI package (openclaw-imessage-photon-cli)
        run: |
          cd cli
          npm publish --provenance