name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishers — no long-lived token in secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install & build main package
        run: |
          npm ci || npm install
          npm run build

      # npm ≥9.8.1 on GitHub Actions with id-token:write resolves credentials
      # via OIDC against the Trusted Publisher configured on the npm package.
      - name: Publish main package (openclaw-imessage-photon)
        run: npm publish --provenance

      - name: Publish CLI package (openclaw-imessage-photon-cli)
        run: |
          cd cli
          npm publish --provenance