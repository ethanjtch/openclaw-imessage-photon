name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install & build main package
        run: |
          npm ci || npm install
          npm run build

      # NODE_AUTH_TOKEN is generated by setup-node from the GitHub OIDC id
      # token; npm exchanges it against the Trusted Publisher on npmjs.
      - name: Publish main package (openclaw-imessage-photon)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package (openclaw-imessage-photon-cli)
        run: |
          cd cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auto-create a GitHub Release for this v* tag with generated notes
      # (commits since the previous tag). If a release already exists for the
      # tag (e.g. created manually), this step is skipped.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
