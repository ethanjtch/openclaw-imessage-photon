name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install & build main package
        run: |
          npm ci || npm install
          npm run build

      # NODE_AUTH_TOKEN is generated by setup-node from the GitHub OIDC id
      # token; npm exchanges it against the Trusted Publisher on npmjs.
      - name: Publish main package (openclaw-imessage-photon)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package (openclaw-imessage-photon-cli)
        run: |
          cd cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auto-create a bilingual GitHub Release for this v* tag. Notes are
      # generated with a fixed EN/中文 template + the commit list for this tag.
      # If a release already exists for the tag (e.g. hand-written), this step
      # is skipped so hand-written notes are never clobbered.
      - name: Create GitHub Release (bilingual notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --abbrev=0 --tags "${TAG}^" 2>/dev/null || echo "")"
          [ -n "$PREV" ] && RANGE="${PREV}..${TAG}" || RANGE="${TAG}"
          BODY="/tmp/release-notes-${TAG}.md"
          {
            echo "## ${TAG} — 更新 / Release"
            echo
            echo "**English**"
            echo
            echo "### Changes in this release"
            echo
            git log --oneline --no-decorate ${RANGE} 2>/dev/null | sed 's/^/- /'
            echo
            echo "**中文**"
            echo
            echo "### 本版本更新"
            echo
            git log --oneline --no-decorate ${RANGE} 2>/dev/null | sed 's/^/- /'
            echo
            echo "_Notes auto-generated by CI / 本说明由 CI 自动生成。_"
          } > "$BODY"
          gh release create "$TAG" -t "${TAG} — 更新 / Release" -F "$BODY" || echo "release for $TAG already exists — skipping (hand-written notes win)"
