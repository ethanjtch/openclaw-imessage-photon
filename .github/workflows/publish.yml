name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install & build main package
        run: |
          npm ci || npm install
          npm run build

      # NODE_AUTH_TOKEN is generated by setup-node from the GitHub OIDC id
      # token; npm exchanges it against the Trusted Publisher on npmjs.
      - name: Publish main package (openclaw-imessage-photon)
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package (openclaw-imessage-photon-cli)
        run: |
          cd cli
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
